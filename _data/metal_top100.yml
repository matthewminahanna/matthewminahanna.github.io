# My 100 metal albums  →  shown on /person/music/
#
# One entry per album. Order in this file doesn't matter; `rank` does.
# The page starts at #1 and counts up (change `countdown` in
# person/music/index.html to flip that).
#
#   rank    required  1–100
#   album   required
#   artist  required
#   year    optional
#   genre   optional  shown next to the year
#   cover   optional  usually not needed: drop a square image into
#                     assets/img/albums/ named after the artist and album
#                     (vektor-terminal-redux.jpg) or just the album
#                     (terminal-redux.jpg) and it's picked up on its own.
#                     jpg, png and webp all work; ~1200px is plenty. Set
#                     `cover:` only to use a different file. Albums with no
#                     image get a generated placeholder cover.
#                     Covers are fetched automatically by the "Album covers"
#                     GitHub Action whenever this list changes.
#   cover_url optional  tells that Action which image to download: a direct
#                     image link, or the album's Wikipedia article. To swap
#                     an existing cover, set this and delete the old file.
#   tracks  optional  list of standout tracks, e.g. [Charging the Void, Recharging the Void]
#   blurb   optional  your write-up; Markdown works. Use `blurb: >-` for one
#                     paragraph, or `blurb: |` for several (blank line between).

